name: نشر الموقع على GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: استدعاء الكود (Checkout)
        uses: actions/checkout@v4

      - name: إعداد صفحات جيت هب (Setup Pages)
        uses: actions/configure-pages@v5

      - name: تجهيز ملفات الموقع للرفع (Upload Artifact)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: نشر الموقع رسمياً (Deploy to Pages)
        id: deployment
        uses: actions/deploy-pages@v4
